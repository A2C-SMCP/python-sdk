[tool.bumpversion]
current_version = "0.5.0a2"
parse = """(?x)
    ^
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        (?P<pre_l>a|b|rc)
        (?P<pre_n>0|[1-9]\\d*)
    )?
    (?:
        (?P<dev>.dev)
        (?P<dev_n>0|[1-9]\\d*)
    )?
    (?:
        (?P<post>.post)
        (?P<post_n>0|[1-9]\\d*)
    )?
    $
"""
serialize = [
    "{major}.{minor}.{patch}{pre_l}{pre_n}",
    "{major}.{minor}.{patch}{dev}{dev_n}",
    "{major}.{minor}.{patch}{post}{post_n}",
    "{major}.{minor}.{patch}",
]
tag = true
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""

[tool.bumpversion.parts.pre_l]
# PEP 440: 预发布版本标签，空字符串表示正式版本
# PEP 440: Pre-release labels, empty string represents final release
values = ["a", "b", "rc", ""]
optional_value = ""

[tool.bumpversion.parts.pre_n]
# PEP 440: 预发布版本号，空字符串表示无预发布号
# PEP 440: Pre-release number, empty string means no pre-release number
first_value = 1
optional_value = ""

[tool.bumpversion.parts.dev]
values = [".dev"]

[tool.bumpversion.parts.dev_n]
first_value = 1

[tool.bumpversion.parts.post]
values = [".post"]

[tool.bumpversion.parts.post_n]
first_value = 1

[[tool.bumpversion.files]]
filename = "a2c_smcp/__init__.py"
search = '__version__: str = "{current_version}"'
replace = '__version__: str = "{new_version}"'

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'

# uv.lock：根包 a2c-smcp 的版本行随 bump 在同一 commit 内更新，避免手动同步与移动 tag。
# 用包名锚定，避免误改依赖包中可能出现的同版本字符串；`(?m)` 为多行标志。
[[tool.bumpversion.files]]
filename = "uv.lock"
regex = true
search = '(?m)^name = "a2c-smcp"\nversion = "{current_version}"'
replace = 'name = "a2c-smcp"\nversion = "{new_version}"'
