# 依赖: GitHub Actions, Python 3.11, uv, poethepoet / Deps: GitHub Actions, Python 3.11, uv, poethepoet
# 描述: 普通测试工作流，安装依赖后运行 `poe test`；另含干净安装冒烟 job（#224）
#       Description: Regular test workflow that installs deps then runs `poe test`;
#       plus a clean-install smoke job (#224).

name: Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit/integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # 安装 uv / Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # 缓存虚拟环境 .venv / Cache project virtualenv .venv
      - name: Cache virtualenv
        uses: actions/cache@v5
        with:
          path: .venv
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version || '3.11' }}-${{ hashFiles('**/uv.lock', '**/pyproject.toml') }}-v3
          restore-keys: |
            ${{ runner.os }}-venv-

      # 安装依赖（包含 dev、test、cli 组，确保 poethepoet 可用）
      # Install dependencies (include dev, test, cli groups to ensure poethepoet is available)
      - name: Install dependencies
        run: |
          uv --version
          uv sync --group dev --group test --extra cli

      # 运行 lint 检查（在测试之前确保代码质量）
      # Run lint checks (ensure code quality before tests)
      - name: Run lint
        run: |
          uv run poe lint

      # 运行测试（poe 在虚拟环境中调用）
      # Run tests through poe inside the venv
      - name: Run tests
        run: |
          uv run poe test

      # 可选：展示 pytest 缓存或覆盖率工件（如需可开启）
      # Optional: upload artifacts like coverage reports (uncomment if needed)
      # - name: Upload coverage report
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: coverage-report
      #     path: coverage* || .coverage* || htmlcov

  # ── 干净安装冒烟 / Clean-install smoke (#224) ──────────────────────────────
  # 上面那个 test job 装的是 `uv sync --group dev --group test --extra cli`，其中 dev 组的 poethepoet
  # **传递依赖 pyyaml**。于是「源码 import 了未声明的包」在这个环境里永远当不成问题 —— 这正是 #224
  # 从 v0.2.1 一路逃逸到 v0.4.0 的通道（使用者在干净 pipx 环境跑 `a2c-computer --help` 直接
  # ModuleNotFoundError）。注意它只装了 cli extra：`keyring` 等其它 extra 的成员在 CI 里**并不存在**，
  # 故单元守卫不能靠「已安装」判定声明合规（见 test_packaging_dependencies.py 的判据说明）。
  #
  # 本 job 只装**发布件自己声明的依赖**（core + 指定 extra），复现真实用户的安装面。
  # 与 tests/unit_tests/test_packaging_dependencies.py 互补：单元守卫管「源码 import 未声明」，
  # 本 job 管制品级缺陷（入口点 / 包数据 / 元数据等）。
  #
  # The test job above runs `uv sync --group dev --group test --extra cli`, and dev's poethepoet pulls
  # pyyaml transitively — so an undeclared import can never fail there. That is exactly how #224
  # reached v0.4.0. Note it installs only the cli extra: members of other extras (keyring) are absent
  # in CI, so a unit guard must not judge declaration compliance by "is it installed".
  # This job installs only what the artifact itself declares, reproducing a real user's env.
  clean-install-smoke:
    name: Clean-install smoke (declared deps only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build wheel
        run: uv build

      # 装 [cli] 而非纯 core：文档指引 Computer 使用者装 `a2c-smcp[cli]`，
      # 且 #224 报告者正是注入了 prompt-toolkit/rich/typer 后用 CLI —— 这是最接近真实用户的安装面。
      # 冒烟脚本与 publish.yml **单点复用**（两处逐字复制会静默漂移，使上传前那道闸门失效）。
      # Install [cli] rather than bare core (the documented Computer install, and the surface #224's
      # reporter ended up with). The smoke script is shared with publish.yml so the two gates cannot
      # drift apart.
      - name: Clean-install smoke test
        run: scripts/clean_install_smoke.sh "$PWD"/dist/*.whl cli
