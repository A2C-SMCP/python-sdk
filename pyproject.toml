[project]
name = "a2c-smcp"
version = "0.2.0"
description = "The official Python Computer Client SDK for A2C-SMCP"
authors = [
    {name = "JQQ", email = "jqq1716@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "mcp (>=1.15.0,<2.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "transitions (>=0.9.3,<0.10.0)",
    "python-socketio (>=5.13.0,<6.0.0)",
    "vrl-python (>=0.1.0,<0.2.0)",
    "tzlocal (>=5.0.0,<6.0.0)",
    "aiohttp >=3.12.15,<4.0.0",
    "msgpack >=1.1.0,<2.0.0",
    "watchdog (>=6.0.0,<7.0.0)",
]

[project.scripts]
a2c-computer = "a2c_smcp.computer.cli.main:main"

[project.optional-dependencies]
cli = [
    "typer >=0.17.4,<1.0.0",
    "rich >=14.1.0,<15.0.0",
    "prompt-toolkit >=3.0.52,<4.0.0",
]
# v0.2.1 #65：OS keyring（password:true input 的 SecretStorage 后端，对标 VS Code）。可选——
# 缺失/不可用时 inputs 解析链降级到 env（A2C_INPUT_<ID>），核心功能不依赖它（§9.3 / 决策 #27）。
keyring = [
    "keyring >=25,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest >=8.4.1,<9.0.0",
    "ruff >=0.12.9,<0.13.0",
    "mypy >=1.17.1,<2.0.0",
    "poethepoet >=0.37.0,<0.38.0"
]
test = [
    "polyfactory >=2.22.2,<3.0.0",
    "pytest-asyncio >=1.1.0,<2.0.0",
    "pytest-cov >=6.2.1,<7.0.0",
    "pytest-mock >=3.14.1,<4.0.0",
    "inline-snapshot >=0.27.2,<0.28.0",
    "pytest-dotenv >=0.5.2,<0.6.0",
    "pexpect >=4.9.0,<5.0.0",
    "werkzeug >=3.1.3,<4.0.0",
    "requests >=2.32.5,<3.0.0",
    "websocket-client >=1.8.0,<2.0.0",
    "pytest-timeout >=2.4.0,<3.0.0",
    "pytest-rerunfailures >=16.0,<17.0"
]
build = [
    "bump-my-version>=1.2.4",
]

[tool.poe.tasks]
test = "pytest tests/unit_tests tests/integration_tests"
test-cov = "pytest tests -m 'not e2e' --cov a2c_smcp --cov-report=term-missing --cov-fail-under=0 --cov-config=.coveragerc"
# 中文: e2e 为真进程/socketio 套件，历史上存在 CI 偶发死锁会顶满 6h job 上限（见 PR #103）。
#   --timeout=120 让任何挂起的用例在 120s 内 fail-fast 并打印卡住处栈（signal 法，默认）；
#   --reruns 3 让 CI 慢双核时序竞态导致的偶发失败自动重试恢复，避免整条流水线因 flake 转红。
#   仅作用于 e2e（不影响 unit/integration 的 `test` 任务）。属测试基建，不改业务代码。
# English: the e2e (real-process/socketio) suite has a history of intermittent CI deadlocks that
#   ran to the 6h job cap (see PR #103). --timeout=120 fails any hung test fast (signal method,
#   dumping the frozen stack); --reruns 3 auto-recovers flaky races from the slow 2-core CI timing
#   so a single flake doesn't redden the whole pipeline. e2e-only; test infra, no business-code change.
test-e2e = "pytest tests -m e2e --timeout=120 --reruns 3 --reruns-delay 5"
typecheck = "mypy a2c_smcp"
format = "ruff format ."

[tool.poe.tasks.lint]
sequence = [
    {cmd = "ruff check --fix ."},
    {cmd = "mypy a2c_smcp"}
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "transitions.*",
    "socketio.*",
    "vrl.*",
    "polyfactory.*",
    "inline_snapshot.*",
    "pexpect.*",
    "msgpack",
    "msgpack.*",
    "yaml",
    "yaml.*",
    "keyring",
    "keyring.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "a2c_smcp.utils.async_property.*"
ignore_errors = true
