[project]
name = "a2c-smcp"
version = "0.5.0a1"
description = "The official Python Computer Client SDK for A2C-SMCP"
authors = [
    {name = "JQQ", email = "jqq1716@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "mcp (>=1.29.0,<2.0.0)",
    "pydantic (>=2.11.7,<3.0.0)",
    "transitions (>=0.9.3,<0.10.0)",
    "python-socketio (>=5.13.0,<6.0.0)",
    "vrl-python (>=0.1.0,<0.2.0)",
    "tzlocal (>=5.0.0,<6.0.0)",
    "aiohttp >=3.12.15,<4.0.0",
    "msgpack >=1.1.0,<2.0.0",
    "watchdog (>=6.0.0,<7.0.0)",
    # #224：SKILL frontmatter 解析（computer/skills/staging.py `import yaml`）是**运行期硬需求**。
    #   该 import 自 v0.2.1（21e6016）引入起从未声明为依赖——dev/CI 因 poethepoet 传递带入 pyyaml
    #   而恒能 import，mypy 又被下方 override 显式豁免，于是坏包一路发到 v0.4.0，使用者干净安装
    #   跑 `a2c-computer --help` 导入即崩。SKILL 是协议核心通道（非可选能力），故落 core 而非 extra。
    #   回归守卫：tests/unit_tests/test_packaging_dependencies.py
    "pyyaml (>=6.0.2,<7.0.0)",
]

[project.scripts]
a2c-computer = "a2c_smcp.computer.cli.main:main"

[project.optional-dependencies]
cli = [
    "typer >=0.17.4,<1.0.0",
    "rich >=14.1.0,<15.0.0",
    "prompt-toolkit >=3.0.52,<4.0.0",
]
# v0.2.1 #65：OS keyring（password:true input 的 SecretStorage 后端，对标 VS Code）。可选——
# 缺失/不可用时 inputs 解析链降级到 env（A2C_SMCP_<ENV_SEGMENT(ID)>），核心功能不依赖它（§9.3 / 决策 #27）。
keyring = [
    "keyring >=25,<26",
]
# #187：信令 Server runner 栈（e2e/联调起真实 Socket.IO 服务用）。werkzeug = WSGI 同步 runner，
# uvicorn = ASGI 异步 runner。与 `a2c_smcp.testing` 的惰性导入配合：不装本 extra 时 import 模块不报错，
# 仅调用起服务函数时提示安装。pin 与 test group 保持一致（见下）。
server = [
    "werkzeug >=3.1.3,<4.0.0",
    "uvicorn >=0.38.0,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest >=8.4.1,<9.0.0",
    "ruff >=0.12.9,<0.13.0",
    "mypy >=1.17.1,<2.0.0",
    "poethepoet >=0.37.0,<0.38.0"
]
test = [
    "polyfactory >=2.22.2,<3.0.0",
    "pytest-asyncio >=1.1.0,<2.0.0",
    "pytest-cov >=6.2.1,<7.0.0",
    "pytest-mock >=3.14.1,<4.0.0",
    "inline-snapshot >=0.27.2,<0.28.0",
    "pytest-dotenv >=0.5.2,<0.6.0",
    "pexpect >=4.9.0,<5.0.0",
    # 与 [project.optional-dependencies] server extra 同 pin（#187）：tests 直接 import uvicorn，
    # 不再骑 mcp 的传递依赖（依赖卫生）。
    "werkzeug >=3.1.3,<4.0.0",
    "uvicorn >=0.38.0,<1.0.0",
    "requests >=2.32.5,<3.0.0",
    "websocket-client >=1.8.0,<2.0.0",
    "pytest-timeout >=2.4.0,<3.0.0",
    "pytest-rerunfailures >=16.0,<17.0",
    # #224：依赖覆盖守卫（test_packaging_dependencies.py）用 Requirement/marker 求值判定
    #   「干净 pip 安装可达面」。按 #187 依赖卫生约定显式声明，不骑 pytest/hatchling 的传递依赖。
    "packaging >=24.0,<26.0"
]
build = [
    "bump-my-version>=1.2.4",
]

[tool.poe.tasks]
test = "pytest tests/unit_tests tests/integration_tests"
test-cov = "pytest tests -m 'not e2e' --cov a2c_smcp --cov-report=term-missing --cov-fail-under=0 --cov-config=.coveragerc"
# 中文: e2e 为真进程/socketio 套件，历史上存在 CI 偶发死锁会顶满 job 上限（见 PR #103）。
#   --timeout-method=thread：**关键**——卡死点在 ThreadedChildWatcher 子线程的 os.waitpid（回收
#     stdio 子进程），signal 法的 SIGALRM 无法打断它（实测从不触发，见 #105 调查），故必须用
#     thread 法（faulthandler 打印全部线程栈后 os._exit），命中即快速 RED 并带真实栈，而非挂满守护期。
#   --timeout=120 给任何挂起用例 120s fail-fast；--reruns 3 让慢双核时序竞态偶发失败自动重试恢复。
#   仅作用于 e2e（不影响 unit/integration 的 `test` 任务）。属测试基建，不改业务代码。
# English: e2e (real-process/socketio) has a history of intermittent CI deadlocks (PR #103). The hang
#   sits in os.waitpid on a ThreadedChildWatcher thread (reaping a stdio child) which SIGALRM cannot
#   interrupt — signal-method timeout provably never fired (see #105 investigation). --timeout-method=
#   thread (faulthandler dumps all thread stacks then os._exit) turns the silent hang into a fast RED
#   with the real stack. --timeout=120 fail-fast; --reruns 3 auto-recovers slow-2-core timing flakes.
#   e2e-only; test infra, no business-code change.
test-e2e = "pytest tests -m e2e --timeout=120 --timeout-method=thread --reruns 3 --reruns-delay 5"
typecheck = "mypy a2c_smcp"
format = "ruff format ."

[tool.poe.tasks.lint]
sequence = [
    {cmd = "ruff check --fix ."},
    {cmd = "mypy a2c_smcp"}
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
strict_concatenate = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "mcp.*",
    "transitions.*",
    "socketio.*",
    "vrl.*",
    "polyfactory.*",
    "inline_snapshot.*",
    "pexpect.*",
    "msgpack",
    "msgpack.*",
    # yaml：PyYAML **不发类型存根**（需另装 types-PyYAML），故豁免类型检查——这与下方 `keyring` 同因。
    #   ⚠️ 切勿把本条目理解成「yaml 可以不安装」：#224 正是把这两件事混为一谈——21e6016（v0.2.1 SKILL
    #   子系统）加了这两行 override 却没把 pyyaml 写进 [project] dependencies，让 mypy 对「未安装」主动
    #   沉默，坏包由此逃逸到 v0.4.0。依赖声明在 [project] dependencies，守卫在 test_packaging_dependencies.py。
    "yaml",
    "yaml.*",
    "keyring",
    "keyring.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "a2c_smcp.utils.async_property.*"
ignore_errors = true
